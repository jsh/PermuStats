[project]
name = "permustats"
version = "0.1.0"
description = "Statistical analysis and OEIS validation for permutation fixed points."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "test_*.py"
