[project]
name = "permustats"
version = "0.1.0"
description = "Statistical analysis and OEIS validation for permutation fixed points."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
]

[project.scripts]
permustats = "permustats.main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "ruff>=0.15.4",
    "ty>=0.0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permustats"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["permustats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
