[project]
name = "permustats"
version = "0.1.0"
description = "Statistical analysis and OEIS validation for permutation fixed points."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["permustats"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.4",
    "ty>=0.0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
